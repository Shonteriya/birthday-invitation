<title>Shonteriya's Halloween Girls Night</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#050505;font-family:Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stage{width:min(100vw,430px);height:100vh;position:relative;overflow:hidden;background:#050505}
  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .65s ease,transform .65s ease}
  .closed{opacity:1;transform:scale(1)}
  .open{opacity:0;transform:scale(1.03);pointer-events:none}
  .stage.is-open .closed{opacity:0;transform:scale(.96);pointer-events:none}
  .stage.is-open .open{opacity:1;transform:scale(1);pointer-events:auto}
  .art{width:100%;height:100%;object-fit:contain;display:block}
  .tap{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);
        color:#fff;font-weight:800;text-align:center;font-size:17px;
        text-shadow:0 2px 8px #000;letter-spacing:.3px;
        background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);
        border-radius:999px;padding:12px 18px;backdrop-filter:blur(4px);
        animation:pulse 1.4s infinite;cursor:pointer}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.04)}}
  .form-button{position:absolute;left:50%;top:57.5%;transform:translate(-50%,-50%);
        width:72%;height:8%;background:transparent;border:0;cursor:pointer}
  .form-button:focus{outline:3px solid #fff;outline-offset:4px;border-radius:8px}
  .hint{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);
        color:#fff;font-size:12px;opacity:.75;text-align:center;width:90%}
</style>
